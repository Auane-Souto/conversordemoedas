<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <img src="assets/gifzinho.gif" alt="logo-conversor">

    <main>
        <label for="">
            Converter <b>de</b>
            <select name="" id="">
                <option value="">R$ Real Brasileiro</option>
            </select>
        </label>

        <label for="">
            Converter <b>para</b>
            <select name="" id="">
                <option value="">US$ Dolar americano</option>
                <option value="">€ Euro</option>
            </select>
        </label>

        <label for="">
            Valor
            <input placeholder="R$ 10.000,00">
        </label>

        <button>Converter</button>

        <section>
            <div>
                <img src="assets/real.png" alt="logo-moeda-a-converter">
                <p>Real</p>
                <p>R$ 0,00</p>
            </div>

            <img src="assets/seta.png" alt="seta">

            <div>
                <img src="assets/dolar.usa.png" alt="logo-moeda-convertida">
                <p>Dólar</p>
                <p>R$ 0.0</p>
            </div>

        </section>
    </main>
    
</body>
</html>
