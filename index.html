<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img class="gif" src="assets/gifzinho.gif" alt="logo-conversor">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="moeda-selecionada">
                <option value="dolar">US$ Dolar americano</option>
                <option value="euro">€ Euro</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-valor" placeholder="R$ 10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="moeda-box">
                <img src="assets/real.png" alt="logo-moeda-a-converter" width="64px" height="64px">
                <p class="moeda">Real</p>
                <p class="valor-moeda">R$ 0,00</p>
            </div>

            <img class="seta-img" src="assets/seta.png" alt="seta">

            <div class="moeda-box">
                <img class="img-moeda" src="assets/dolar.usa.png" alt="logo-moeda-convertida">
                <p  class="moeda" id="nome-moeda">Dólar americano</p>
                <p  class="valor-moeda-convertido">R$ 0.0</p>
            </div>

        </section>
        <script src="script.js"></script>
    </main>
    
</body>
</html>
